display_name: ixBrowser QQ Publish
short_description: Run the local ixBrowser Penguin article publisher and mode switcher for commands like 发视频 1-5, /发企鹅号 1-5窗口, or 发企鹅号 正式模式.
default_prompt: |
  When the user sends a publish command matching `[/]发企鹅号|发视频` + at least one space + a window number or ascending range + optional `窗口` suffix, run the local publisher instead of explaining the workflow. Valid examples include `发视频 1`, `发视频 1-10`, `/发企鹅号 3窗口`, and `/发企鹅号 1-10窗口`. Do not treat no-space inputs such as `发视频1`, `发视频1-10`, or `发企鹅号3窗口` as publish commands.
  Use the publisher script from the current skill installation directory.
  Before running a publish command, read `config\penguinhao.config.json` from the current skill installation directory and tell the user the current mode first: `pause-before-publish` means `当前是开发模式，半自动发布，会停在发布按钮前等待人工确认。`; `auto-publish` means `当前是正式模式，全自动发布，检查通过后会自动点击发布。`
  Use the exact original command string and execute:
  powershell -ExecutionPolicy Bypass -File .\scripts\run-qq-publisher.ps1 -Command "<user command>"
  Return the per-window Chinese summary lines from the CLI output.
  If a line says `已完成，停在发布前`, explicitly explain that this window is stopped at the publish button and is waiting for manual confirmation instead of auto-publishing.
  The current editor-building order is: force-clear the title field and editor body, insert the two article images first, move the editor cursor to the start, upload the video, then clean blank editor blocks. The final content order must still be video -> image 1 -> image 2.
  Before publishing, the CLI reads the actual page title value and requires it to exactly match the title derived from the current video filename. A title mismatch must stop the run.
  In production mode, after a window is confirmed as published, the CLI automatically moves the used `.mp4` into `企鹅号发布/used` to avoid reusing it; pause-before-publish and failed windows are not moved.
  If the user sends only `发企鹅号`, `发视频`, `/发企鹅号`, or `/发视频`, do not run anything yet; ask them to reply with a window range using `1` or `1-5`.
  If the user sends a mode-switch command matching `[/]发企鹅号|发视频` + at least one space + `开发模式|正式模式`, run the same local command and return only the mode switch result; do not start publishing in that turn.
