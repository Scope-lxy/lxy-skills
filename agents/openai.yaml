display_name: ixBrowser QQ Publish
short_description: Run the local ixBrowser Penguin article publisher for commands like 发视频 1-5 or /发企鹅号 1-5窗口; completed articles are saved as drafts.
default_prompt: |
  When the user sends a publish command matching `[/]发企鹅号|发视频` + at least one space + a window number or ascending range + optional `窗口` suffix, run the local publisher instead of explaining the workflow. Valid examples include `发视频 1`, `发视频 1-10`, `/发企鹅号 3窗口`, and `/发企鹅号 1-10窗口`. Do not treat no-space inputs such as `发视频1`, `发视频1-10`, or `发企鹅号3窗口` as publish commands.
  Use the publisher script from the current skill installation directory. Before starting, tell the user that this run saves drafts rather than publishing them.
  Use the exact original command string and execute:
  powershell -ExecutionPolicy Bypass -File .\scripts\run-qq-publisher.ps1 -Command "<user command>"
  After the publish command has been started, do not launch the same publish command a second time in the same session just because the local shell view timed out or stayed quiet. Video upload can legitimately take 1-30 minutes. In that situation, treat the existing run as still active, keep waiting, inspect the current terminal/log output if needed, and report the waiting state to the user instead of retrying.
  Return the per-window Chinese summary lines from the CLI output.
  The current editor-building order is: after opening the publish page and checking login, wait 10 seconds so old drafts, title fields, and cover areas can finish restoring; then force-clear the title field and editor body, confirm the editor stays empty across several checks so asynchronously restored old drafts are cleared, insert the two article images first, move the editor cursor to the start, upload the video, then clean blank editor blocks. The final content order must still be video -> image 1 -> image 2.
  Non-upload confirmation steps such as image confirmation, title readback, cover upload, declaration confirmation, the save-draft button, and the save-success prompt use a short settle wait before continuing. After video upload starts, never refresh the page or restart the same publish command as a retry. During the long upload wait, the CLI emits progress every 30 seconds and prefers a percentage read from the upload dialog when available; otherwise it falls back to an elapsed-wait message.
  After uploading the article cover, the CLI must confirm that the cover preview actually changed. If it did not change, it stops with `文章封面上传后预览未变化`.
  The video cover tab is `上传封面`; the article cover tab is `本地上传`. If the editor already contains inline images or Penguin restores old draft material, the article-cover dialog may default to `文内图片`, so the CLI should switch back to and confirm `本地上传` before uploading the article cover. For cover, declaration, and final review steps, prefer clear success signals over forcing the user to intervene: if the target state is readable, validate it strictly; if not, allow continuation when the page already shows a strong success signal. Stop only when a critical result is unreadable and has no trustworthy fallback signal, or on explicit contradictions such as the wrong tab, an unchanged preview, or a mismatched title.
  After the first click on the video-upload dialog confirm button, the CLI should not assume failure just because the dialog stays open briefly. If the button enters an animation, loading, disabled, or similar processing state, keep observing instead of double-clicking too early.
  Before saving a draft, the CLI reads the actual page title value and requires it to exactly match the title derived from the current video filename. On mismatch, it automatically fills the correct title once and rechecks; if the title is still wrong, it stops the run.
  After final validation, the CLI clicks the save-draft button by exact label priority: `存草稿`, then `保存草稿`, then `草稿`. The first required success signal is the top-page `保存成功` prompt; never treat the editor's lower-left `已保存` auto-save indicator as success. Then wait 3 seconds, navigate to `https://om.qq.com/main/management/articleManage`, and require an exact current-title match in the content list. Only after both confirmations does the CLI move the used `.mp4` into `企鹅号发布/used`; it does not move videos when either confirmation fails.
  If the user sends only `发企鹅号`, `发视频`, `/发企鹅号`, or `/发视频`, do not run anything yet; ask them to reply with a window range using `1` or `1-5`.
